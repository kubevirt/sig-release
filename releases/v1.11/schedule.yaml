- when: 2027/02/24
  milestone: KubeVirt Code Freeze
  who: KubeVirt
  what: Change merging rules on main branch
  notes: Enter selective code freeze on main. Human-authored PRs require approved-vep,
    or kind/bug or kind/flake together with priority/critical-urgent, in addition to
    normal merge requirements. The trusted-bot route remains available. Other exceptions
    need an agreed technical admission route. See the
    [draft freeze-enforcement VEP](https://github.com/kubevirt/enhancements/pull/221)
    for eligibility details and proposed next-release-branch protection.
- when: 2027/03/03
  milestone: KubeVirt Code Thaw
  who: KubeVirt
  what: Branch release-1.11 and tag v1.11.0-rc.0 on release-1.11;
    restore normal merging. See the
    [draft thaw procedure](https://github.com/kubevirt/enhancements/pull/221)
    proposing branch and required-CI verification before lifting the gate,
    followed by verification of restored merge eligibility. If next-release-branch
    protection is adopted, lift the gate on both main and release-1.11.
  notes: Enter stabilization phase, review [list of quarantined tests](https://storage.googleapis.com/kubevirt-prow/reports/quarantined-tests/kubevirt/kubevirt/index.html).
